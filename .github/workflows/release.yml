name: Release APK
on:
  push:
    tags: [ 'v*' ]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.9' }
      - name: Optional private signing key
        env: { KS_B64: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > app/private.keystore; fi
      - name: Build
        env: { KS_PASS: '${{ secrets.KS_PASS }}', KS_ALIAS: '${{ secrets.KS_ALIAS }}' }
        run: gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with: { files: app/build/outputs/apk/debug/app-debug.apk }
