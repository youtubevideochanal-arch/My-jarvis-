name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Restore shared debug key if the binary file did not upload
        run: |
          if [ ! -s app/debug.keystore ]; then base64 -d app/debug.keystore.b64 > app/debug.keystore; fi
      - name: Optional private signing key (GitHub Secrets)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > app/private.keystore; fi
      - name: Build debug APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Check APK is valid and signed
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          unzip -tq "$APK"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/aapt2 dump badging "$APK" | grep -E "^package|sdkVersion|targetSdk" || true
          $BT/apksigner verify --verbose --print-certs "$APK" | grep -E "Verifies|SHA-256" | head -3
          cp "$APK" MY-AGENT.apk
      - name: Lite build (kam components - agar full APK install na ho)
        continue-on-error: true
        run: |
          gradle assembleDebug --no-daemon -Pmf=lite
          cp app/build/outputs/apk/debug/app-debug.apk MY-AGENT-lite.apk
      - name: Min build (sabse kam components)
        continue-on-error: true
        run: |
          gradle assembleDebug --no-daemon -Pmf=min
          cp app/build/outputs/apk/debug/app-debug.apk MY-AGENT-min.apk
      - name: Upload artifact (zip me aata hai - andar se .apk nikalna)
        uses: actions/upload-artifact@v4
        with:
          name: MyAgent-debug-apk
          path: |
            MY-AGENT*.apk
      - name: Publish direct APK link (Releases -> latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK (direct download, zip nahi)
          prerelease: true
          files: |
            MY-AGENT*.apk
